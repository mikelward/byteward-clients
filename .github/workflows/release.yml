name: release

# Builds the browser extension for Chrome, Edge and Firefox and attaches the
# store-ready zips, with checksums, to a GitHub release.
#
# Runs when a tag like v2026.11.0.1 is pushed. The tag without its "v" becomes
# the extension's version: browser stores need it to go up with every upload
# and allow up to four numbers, so use the upstream version plus a fourth
# number for Byteward's own releases.
#
# Two jobs, so that neither holds more than it needs:
#   build    runs npm install and the build, and therefore dependency code.
#            Holds no token that can write anything.
#   publish  holds `contents: write` to create the release. Runs nothing but
#            the GitHub CLI on the built zips.
on:
  push:
    tags: ["v*"]

# Read by default; only the job that needs more asks for it, in its own block.
permissions:
  contents: read

# Two releases at once would race to create the same release, so they run one
# at a time. A running release is never cancelled part-way.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        browser: [chrome, edge, firefox]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # A release builds from a clean install, never from a cache that a
          # pull request's run could have written.
          package-manager-cache: false

      - name: Set the version from the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){0,3}$'; then
            echo "::error::Tag $TAG isn't a valid extension version (up to four numbers, e.g. v2026.11.0.1)"
            exit 1
          fi
          for f in apps/browser/src/manifest.json apps/browser/src/manifest.v3.json; do
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" "$f"
          done
          echo "::notice::Version $VERSION"

      - run: npm ci

      - name: Build
        working-directory: apps/browser
        env:
          BROWSER: ${{ matrix.browser }}
        run: npm run "dist:$BROWSER"

      - uses: actions/upload-artifact@v7
        with:
          name: byteward-${{ matrix.browser }}
          path: apps/browser/dist/dist-${{ matrix.browser }}.zip
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # create the release
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: byteward-*
          path: dist
          merge-multiple: true

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        working-directory: dist
        run: |
          for f in dist-*.zip; do mv "$f" "byteward-${f#dist-}"; done
          sha256sum ./*.zip > SHA256SUMS
          gh release create "$TAG" ./* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Byteward browser extension ${TAG#v}" \
            --generate-notes
