# Ordered: the FIRST matching rule wins, and anything matching no rule is code.
#
# The lane's test is "can this change what CI validates?". Markdown is
# documentation -- READMEs, docs/, and the agent instructions under .claude/ --
# except inside the app and library trees, where a build or a test can read a
# file of any extension. Those trees are named first so the general markdown
# rule below never gets asked about them.
#
# `**`, not `*`: path.matchesGlob's `*` never crosses `/`.
code apps/**
code libs/**
code bitwarden_license/**
docs **/*.md

# The one subject prefix the docs lane accepts: every file it admits is
# markdown outside the source trees, so a commit doing any other kind of work
# would carry another file and ride the code lane instead.
prefixes docs

# ci.yml's workflow_dispatch is for re-running a pull request's checks, so a
# dispatch that names no pull request is refused.
dispatch-without-pr refuse
